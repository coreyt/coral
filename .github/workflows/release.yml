name: Create Coral GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Coral version
        required: true
        type: string
      commit:
        description: Exact approved product SHA
        required: true
        type: string
      candidate_run_id:
        description: Successful exact-SHA final-candidate CI run ID
        required: true
        type: string
      pages_run_id:
        description: Successful exact-SHA production Pages run ID
        required: true
        type: string

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      actions: read
      deployments: read
    runs-on: ubuntu-latest
    outputs:
      candidate-manifest-sha256: ${{ steps.evidence.outputs.candidate-manifest-sha256 }}
      preflight-sha256: ${{ steps.evidence.outputs.preflight-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm run check:toolchain
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: coreyt/coral
          run-id: ${{ inputs.candidate_run_id }}
          name: node-26-candidate-packages
          path: candidate-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: coreyt/coral
          run-id: ${{ inputs.candidate_run_id }}
          name: final-candidate-proof
          path: candidate-proof
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: coreyt/coral
          run-id: ${{ inputs.pages_run_id }}
          name: github-pages
          path: pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact candidate, packages, Pages and immutable-release readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_PAGES_RUN_ID: ${{ inputs.pages_run_id }}
          RELEASE_CANDIDATE_PROOF: candidate-proof/final-candidate-proof.json
          RELEASE_PAGES_ARTIFACT: pages-artifact/artifact.tar
          RELEASE_CANDIDATE_MANIFEST: candidate-artifacts/candidate-manifest.json
          RELEASE_PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          RELEASE_TAG_REGISTRY_VERIFICATION: true
        run: |
          node scripts/release-guard.mjs
          node scripts/release-final-candidate.mjs candidate-proof/final-candidate-proof.json candidate-artifacts/candidate-manifest.json
          node scripts/candidate-artifacts.mjs verify candidate-artifacts
          node scripts/release-registry.mjs verify
          node scripts/github-release-guard.mjs
      - name: Record independently verified release evidence digests
        id: evidence
        run: |
          echo "candidate-manifest-sha256=$(sha256sum candidate-artifacts/candidate-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "preflight-sha256=$(sha256sum github-release-preflight.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  release:
    if: ${{ needs.verify.result == 'success' }}
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Materialize independently checked asset digests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_MANIFEST_SHA256: ${{ needs.verify.outputs.candidate-manifest-sha256 }}
          PREFLIGHT_SHA256: ${{ needs.verify.outputs.preflight-sha256 }}
        run: >-
          node -e "const fs=require('node:fs');fs.writeFileSync('release-evidence.json',
          JSON.stringify({version:process.env.RELEASE_VERSION,productSha:process.env.RELEASE_COMMIT,
          candidateManifestSha256:process.env.CANDIDATE_MANIFEST_SHA256,
          preflightSha256:process.env.PREFLIGHT_SHA256},null,2)+'\n')"
      - name: Create immutable annotated tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}" || true
          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            test "$(git cat-file -t "refs/tags/v${RELEASE_VERSION}")" = tag
            test "$(git rev-list -n 1 "refs/tags/v${RELEASE_VERSION}")" = "${RELEASE_COMMIT}"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag --annotate "v${RELEASE_VERSION}" "${RELEASE_COMMIT}" --message "Coral ${RELEASE_VERSION}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi
          node scripts/release-notes.mjs "${RELEASE_VERSION}" > release-notes.md
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release download "v${RELEASE_VERSION}" --pattern release-evidence.json --output existing-release-evidence.json
            cmp release-evidence.json existing-release-evidence.json
            if [ "$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "v${RELEASE_VERSION}" --verify-tag --title "Coral ${RELEASE_VERSION}" --notes-file release-notes.md --draft=false
            fi
          else
            gh release create "v${RELEASE_VERSION}" release-evidence.json --verify-tag --target "${RELEASE_COMMIT}" --title "Coral ${RELEASE_VERSION}" --notes-file release-notes.md
          fi
          test "$(gh api "repos/coreyt/coral/releases/tags/v${RELEASE_VERSION}" --jq .immutable)" = true
