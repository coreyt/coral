<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Coral text-to-diagram overview</title>
  <desc id="desc">Three rounded objects labelled Source, Transform, and Result connected from left to right.</desc>
  <rect width="720" height="180" rx="16" fill="#f5f7fb"/>
  <g fill="#ffffff" stroke="#355070" stroke-width="3">
    <rect x="35" y="55" width="160" height="70" rx="12"/>
    <rect x="280" y="55" width="160" height="70" rx="12"/>
    <rect x="525" y="55" width="160" height="70" rx="12"/>
  </g>
  <g stroke="#e56b6f" stroke-width="4" fill="none">
    <path d="M195 90h75"/>
    <path d="M440 90h75"/>
  </g>
  <g fill="#1f2937" font-family="sans-serif" font-size="22" text-anchor="middle">
